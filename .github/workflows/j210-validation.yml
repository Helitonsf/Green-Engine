name: J.2.10 Validation

# Triggered once to validate the committed engine and mock integration.
on:
  push:
    paths:
      - '.github/workflows/j210-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check green-engine-v6.3.16-com-ci/cloudflare/history-core.js
      - name: Mock integration test
        run: node green-engine-v6.3.16-com-ci/tests/test-history-mock.mjs
      - name: Existing core test
        run: node green-engine-v6.3.16-com-ci/tests/test-history-core.mjs
      - name: Remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/j210-validation.yml
          git commit -m 'chore: remove one-time J.2.10 validation workflow'
          git push origin HEAD:main
