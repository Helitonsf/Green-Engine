name: Deploy Green Engine Worker

on:
  push:
    branches: [main]
    paths:
      - 'green-engine-v6.3.16-com-ci/cloudflare/**'
      - 'green-engine-v6.3.16-com-ci/worker/**'
      - 'green-engine-v6.3.16-com-ci/wrangler.toml'
      - 'green-engine-v6.3.16-com-ci/package.json'
      - 'green-engine-v6.3.16-com-ci/package-lock.json'
      - 'green-engine-v6.3.16-com-ci/tests/**'
      - 'green-engine-v6.3.16-com-ci/public/**'
      - 'green-engine-v6.3.16-com-ci/scripts/**'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-engine-v6.3.16-com-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: green-engine-v6.3.16-com-ci/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Force provider default auto in public UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          if p.exists():
            t = p.read_text(encoding="utf-8")
            t2 = t.replace('provider = "sportmonks"', 'provider = "auto"').replace('|| "sportmonks"', '|| "auto"').replace('provider = "api-football"', 'provider = "auto"').replace('|| "api-football"', '|| "auto"')
            p.write_text(t2, encoding="utf-8")
            print("patched" if t2 != t else "no change")
          PY

      - name: Apply UI redesign + history-lazy + odds patches
        run: python3 scripts/apply-ui-redesign.py

      - name: Validate Worker syntax
        run: >-
          node --check cloudflare/history-core.js &&
          node --check cloudflare/kv-cache.js &&
          node --check cloudflare/providers/api-football.js &&
          node --check cloudflare/providers/api-football-history.js &&
          node --check cloudflare/providers/api-football-odds.js &&
          node --check cloudflare/providers/team-history.js &&
          node --check cloudflare/providers/league-catalog.js &&
          node --check cloudflare/providers/football-data.js &&
          node --check cloudflare/providers/football-data-history.js &&
          node --check worker/index.js

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-engine-v6.3.16-com-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: green-engine-v6.3.16-com-ci/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Force provider default auto in public UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          if p.exists():
            t = p.read_text(encoding="utf-8")
            t2 = t.replace('provider = "sportmonks"', 'provider = "auto"').replace('|| "sportmonks"', '|| "auto"').replace('provider = "api-football"', 'provider = "auto"').replace('|| "api-football"', '|| "auto"')
            p.write_text(t2, encoding="utf-8")
            print("patched" if t2 != t else "no change")
          PY

      - name: Apply UI redesign + history-lazy + odds patches
        run: python3 scripts/apply-ui-redesign.py

      - name: Ensure HISTORY_KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ensure-history-kv.sh

      - name: Deploy Worker to Cloudflare (v6-3-15, primary with API key)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: green-engine-v6.3.16-com-ci
          command: deploy

      - name: Point wrangler name to legacy v6-3-16
        run: |
          sed -i 's/name = "green-engine-v6-3-15-cf"/name = "green-engine-v6-3-16-cf"/' wrangler.toml
          grep '^name' wrangler.toml

      - name: Deploy Worker to Cloudflare (v6-3-16, redirects to v15)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: green-engine-v6.3.16-com-ci
          command: deploy
