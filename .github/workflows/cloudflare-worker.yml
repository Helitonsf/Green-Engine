name: Deploy Green Engine Worker

on:
  push:
    branches: [main]
    paths:
      - 'green-engine-v6.3.16-com-ci/cloudflare/**'
      - 'green-engine-v6.3.16-com-ci/worker/**'
      - 'green-engine-v6.3.16-com-ci/wrangler.toml'
      - 'green-engine-v6.3.16-com-ci/package.json'
      - 'green-engine-v6.3.16-com-ci/package-lock.json'
      - 'green-engine-v6.3.16-com-ci/tests/**'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-engine-v6.3.16-com-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: green-engine-v6.3.16-com-ci/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker syntax
        run: >-
          node --check cloudflare/history-core.js &&
          node --check cloudflare/kv-cache.js &&
          node --check cloudflare/providers/api-football.js &&
          node --check cloudflare/providers/api-football-history.js &&
          node --check cloudflare/providers/team-history.js &&
          node --check cloudflare/providers/league-catalog.js &&
          node --check worker/index.js

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-engine-v6.3.16-com-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: green-engine-v6.3.16-com-ci
          command: deploy

# Production deploy only runs after tests pass on main.
