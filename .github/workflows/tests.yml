name: Green Engine Tests

on:
  push:
    branches: [main]
    paths:
      - 'green-engine-v6.3.16-com-ci/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'green-engine-v6.3.16-com-ci/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-engine-v6.3.16-com-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: green-engine-v6.3.16-com-ci/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
