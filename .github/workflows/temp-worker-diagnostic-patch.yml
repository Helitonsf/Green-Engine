name: Temporary Worker diagnostic patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('green-engine-v6.3.16-com-ci/worker/index.js')
          s = p.read_text(encoding='utf-8')
          old = 'apiFootball: { configured: apiFootballConfigured(env), count: apiFootballFixtures.length }'
          new = 'apiFootball: { configured: apiFootballConfigured(env), count: apiFootballFixtures.length, status: apiFootball?.diagnostic?.status ?? null, errors: apiFootball?.diagnostic?.errors ?? null }'
          if s.count(old) != 2:
              raise SystemExit(f'expected 2 sports diagnostic targets, found {s.count(old)}')
          s = s.replace(old, new)
          old2 = 'apiFootball: { configured: apiFootballConfigured(env), count: apiFootball.length }'
          new2 = 'apiFootball: { configured: apiFootballConfigured(env), count: apiFootball.length, status: apiFootball?.diagnostic?.status ?? null, errors: apiFootball?.diagnostic?.errors ?? null }'
          if s.count(old2) != 1:
              raise SystemExit(f'expected 1 league diagnostic target, found {s.count(old2)}')
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          print('worker diagnostic patch applied')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add green-engine-v6.3.16-com-ci/worker/index.js .github/workflows/temp-worker-diagnostic-patch.yml
          git commit -m 'fix: expose sanitized provider diagnostics'
          git push
