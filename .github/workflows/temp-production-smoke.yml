name: Temporary Green Engine production smoke

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployed hybrid API
        env:
          WORKER_URL: https://green-engine-v6-3-15-cf.gerenteheliton.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.WORKER_URL;
          const date = '2026-09-09';
          const getJson = async (url) => {
            const r = await fetch(url);
            const text = await r.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`Non-JSON ${r.status}: ${text.slice(0,300)}`); }
            if (!r.ok) throw new Error(`HTTP ${r.status}: ${JSON.stringify(data).slice(0,700)}`);
            return data;
          };
          const sports = await getJson(`${base}/api/sports?date=${date}`);
          console.log('SPORTS_SOURCES', JSON.stringify(sports.sources));
          const leagues = await getJson(`${base}/api/leagues`);
          console.log('LEAGUE_SOURCES', JSON.stringify(leagues.sources));
          const rows = Array.isArray(sports.data) ? sports.data : [];
          const af = rows.find(x => x.provider === 'api-football' && /premiership/i.test(x.league?.name || '') && /scotland/i.test(x.league?.country || '')) || rows.find(x => x.provider === 'api-football' && /premiership/i.test(x.league?.name || ''));
          if (!af?.id) throw new Error(`No suitable API-Football fixture found; sources=${JSON.stringify(sports.sources)} providers=${[...new Set(rows.map(x => x.provider))].join(',')}`);
          console.log(`fixture=${af.id} ${af.name || ''} league=${af.league?.name || ''} country=${af.league?.country || ''}`);
          const fixture = await getJson(`${base}/api/fixture?id=${encodeURIComponent(af.id)}&provider=api-football`);
          if (fixture.provider !== 'api-football' || !fixture.data?.id) throw new Error('API-Football fixture normalization failed');
          const history = await getJson(`${base}/api/history?fixture=${encodeURIComponent(af.id)}&provider=api-football`);
          if (history.provider !== 'api-football' || !history.ok) throw new Error(`History failed: ${JSON.stringify(history).slice(0,800)}`);
          const d = history.diagnostic || {};
          if (d.currentFixtureExcluded !== true) throw new Error('Current fixture exclusion failed');
          if (d.homeHistoryCount !== 5 || d.awayHistoryCount !== 5) throw new Error(`History sample invalid: ${JSON.stringify(d)}`);
          if (d.homeVenueCorrect !== true || d.awayVenueCorrect !== true) throw new Error(`Venue validation failed: ${JSON.stringify(d)}`);
          if (d.allHistoryBeforeFixture !== true) throw new Error('History contains fixture at/after target');
          if (history.greenScore?.oddsInfluence !== false) throw new Error('Odds influence flag is not false');
          if (!Array.isArray(history.greenScore?.ranking) || history.greenScore.ranking.length < 1) throw new Error('Green Score ranking missing');
          console.log('SMOKE_OK', JSON.stringify({ fixture: af.id, homeHistory: d.homeHistoryCount, awayHistory: d.awayHistoryCount, markets: history.greenScore.ranking.length, oddsInfluence: history.greenScore.oddsInfluence }));
          NODE
      - name: Remove temporary workflow after success
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-production-smoke.yml
          git commit -m 'chore: remove temporary production smoke workflow'
          git push
