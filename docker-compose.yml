services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: green_engine
      POSTGRES_USER: green
      POSTGRES_PASSWORD: green
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
