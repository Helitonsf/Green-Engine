name = "green-engine-v6-3-15-cf"
main = "worker/index.js"
compatibility_date = "2026-08-12"

preview_urls = false

[assets]
directory = "./public"

[secrets]
required = ["API_FOOTBALL_KEY"]

# ALLOWED_ORIGINS autoriza o dashboard publicado no GitHub Pages a consumir
# a API deste Worker por navegador (CORS).
[vars]
ALLOWED_ORIGINS = "https://helitonsf.github.io"

# --- Cloudflare KV (cache de histórico) ---
# Descomente o bloco abaixo DEPOIS de criar o namespace:
#
#   cd green-engine-v6.3.16-com-ci
#   npx wrangler kv namespace create green-engine-history
#   # copie o id retornado e cole em id= e preview_id=
#
# [[kv_namespaces]]
# binding = "HISTORY_KV"
# id = "COLE_O_ID_AQUI"
# preview_id = "COLE_O_ID_AQUI"
#
# Com HISTORY_KV ativo:
#   - team:{id}:season:{year}  TTL 1h  (lista de jogos do time)
#   - history:fixture:{id}     TTL 30min (análise completa)
# Sem o binding, o Worker segue só com Cache API de edge (já existente).
