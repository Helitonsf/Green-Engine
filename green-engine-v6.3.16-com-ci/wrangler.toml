name = "green-engine-v6-3-15-cf"
main = "worker/index.js"
compatibility_date = "2026-08-12"

preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Secrets:
#   wrangler secret put FOOTBALL_DATA_API_KEY   # obrigatório (dados)
#   wrangler secret put THE_ODDS_API_KEY        # opcional (odds)

[vars]
ALLOWED_ORIGINS = "https://helitonsf.github.io,https://green-engine-v6-3-15-cf.gerenteheliton.workers.dev,https://green-engine-v6-3-16-cf.gerenteheliton.workers.dev"

